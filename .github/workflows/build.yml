# Checks the design (ERC/DRC) and builds the schematic PDF, an OSH
# Park-ready Gerber/drill package, and the case STLs. Outputs are uploaded as
# workflow artifacts; pushing a v* tag also publishes them as a GitHub
# release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.8
      options: --user root
    env:
      HOME: /tmp/kicad-home
    steps:
      - uses: actions/checkout@v4

      - name: Check design and build outputs
        run: scripts/build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: output/
          if-no-files-found: error

  case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad

      - name: Check case and export STLs
        run: scripts/build-case.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case
          path: output-case/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [build, case]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: outputs
          path: output

      - uses: actions/download-artifact@v4
        with:
          name: case
          path: output

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(output/*-oshpark.zip output/*-schematic.pdf output/*-case-*.stl)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
